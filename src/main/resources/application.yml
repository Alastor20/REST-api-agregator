server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-aggregator
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  polling:
    n: 3
    t: 10
  storage:
    format: json
    file: data/results.json
    mode: create
  sources:
    weather:
      params:
        - latitude: "52.52"
          longitude: "13.41"
          current_weather: "true"
        - latitude: "48.85"
          longitude: "2.35"
          current_weather: "true"
    currency:
      params:
        - from: USD
          to: EUR
        - from: USD
          to: GBP
    books:
      params:
        - q: "harry potter"
          limit: "5"
        - q: "lord of the rings"
          limit: "5"